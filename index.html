<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão GETEC | SENAR-AR/MA</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #06473d; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #aviso { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px;
           font-family: Arial, sans-serif; color: #fff; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<iframe
  id="sistema"
  src="COLE_AQUI_O_LINK_/exec_DO_SISTEMA_GETEC"
  title="Gestão GETEC - SENAR-AR/MA"
  allow="clipboard-write; fullscreen"
  allowfullscreen></iframe>
<div id="aviso">Falta colar o link /exec do sistema dentro de src="..." neste arquivo.</div>
<script>
  // Aviso apenas se o link ainda não foi colocado
  (function () {
    var f = document.getElementById('sistema');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(f.getAttribute('src'))) {
      f.style.display = 'none';
      document.getElementById('aviso').style.display = 'flex';
    }
  })();
</script>
</body>
</html>
